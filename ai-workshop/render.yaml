services:
  - type: web
    name: motomod-api
    runtime: python
    rootDir: ai-workshop/backend
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: FRONTEND_URL
        value: https://motomod.onrender.com
      - key: SECURE_COOKIES
        value: "true"

  - type: web
    name: motomod
    runtime: static
    rootDir: ai-workshop/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://motomod-api.onrender.com
